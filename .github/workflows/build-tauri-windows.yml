name: Validate Tauri Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri -> target"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Require checked dependency locks
        shell: pwsh
        run: |
          if (-not (Test-Path 'package-lock.json')) { throw 'package-lock.json is required before public CI is enabled.' }
          if (-not (Test-Path 'src-tauri/Cargo.lock')) { throw 'src-tauri/Cargo.lock is required before public CI is enabled.' }
      - run: npm ci --ignore-scripts
      - run: npm run release:check
      - run: npm run test:github-updater-integration
      - name: Verify release-candidate workflow remains non-publishing
        run: node scripts/test-release-candidate-workflow.mjs
      - name: Audit validation contract links
        run: node scripts/test-validation-contract-links.mjs
      - name: Temporary audit of deep release-integrity split
        run: node scripts/test-release-integrity-deep-v0.11.34.mjs
      - name: Strict application TypeScript check
        run: node node_modules/typescript/bin/tsc -p tsconfig.app.json
      - name: Verify transitive third-party license metadata
        run: npm run audit:third-party
      - name: Classify Windows distribution dependencies
        run: node scripts/audit-third-party-distribution.mjs --target x86_64-pc-windows-msvc
      - name: Generate Windows runtime third-party notices
        run: node scripts/generate-third-party-notices.mjs --target x86_64-pc-windows-msvc --output THIRD_PARTY_NOTICES.txt
      - name: Verify generated notice is nonempty and final
        shell: pwsh
        run: |
          if (-not (Test-Path 'THIRD_PARTY_NOTICES.txt')) { throw 'Generated THIRD_PARTY_NOTICES.txt is missing.' }
          if ((Get-Item 'THIRD_PARTY_NOTICES.txt').Length -lt 1024) { throw 'Generated THIRD_PARTY_NOTICES.txt is unexpectedly small.' }
          if (Select-String -Path 'THIRD_PARTY_NOTICES.txt' -Pattern 'full transitive dependency/license inventory' -Quiet) { throw 'Obsolete incomplete-compliance wording remains in generated notices.' }
      - name: Run all registered self-contained regression suites
        run: npm run test:rc-regression-matrix
      - name: Require zero unused source carry
        run: npm run audit:unused-carry
      - name: Verify native tests with locked dependencies
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
