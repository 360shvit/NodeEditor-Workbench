name: Dependency Approval

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require current owner approval for Dependabot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$PR_AUTHOR" != "dependabot[bot]" ]]; then
            echo "Non-Dependabot pull request: no dependency approval gate required."
            exit 0
          fi

          approvals=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
            --jq "[.[] | select(.state == \"APPROVED\" and .user.login == \"$REPOSITORY_OWNER\" and .commit_id == \"$PR_HEAD_SHA\")] | length")

          if [[ "$approvals" -lt 1 ]]; then
            echo "Dependabot pull request requires approval from $REPOSITORY_OWNER for current head $PR_HEAD_SHA."
            echo "If Dependabot changes/rebases the branch after approval, approve the new head again."
            exit 1
          fi

          echo "Current Dependabot head is explicitly approved by $REPOSITORY_OWNER."
