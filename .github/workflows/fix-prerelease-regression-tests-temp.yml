name: Temporary Prerelease Regression Test Fix

on:
  push:
    branches:
      - prepare-updater-e2e-0.11.36-rc.1

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.1
      - run: npm ci --ignore-scripts
      - name: Patch stale prerelease/version assertions
        run: node scripts/fix-prerelease-regression-tests-temp.mjs
      - name: Verify release contract
        run: npm run release:check
      - name: Run regression matrix
        run: npm run test:rc-regression-matrix
      - name: Verify unused carry
        run: npm run audit:unused-carry
      - name: Verify native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify diff whitespace
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
      - name: Commit prerelease-compatible regression contracts
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Regression contracts are already synchronized.'
            exit 0
          }
          git commit -m 'Make release regression contracts prerelease-aware'
          git push origin HEAD:$env:GITHUB_REF_NAME
