name: Validate Pre-1.0 Track 07 Authority

on:
  push:
    branches: [audit/pre-1.0-full-review]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/pre-1.0-full-review
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: "src-tauri -> target"
          cache-bin: "false"
          save-if: "false"
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Apply Track 07 authority hardening in validation workspace
        run: python scripts/prepare-pre1-track07.py
      - name: Track 07 source/capability gate
        run: npm run test:pre1-native-authority-boundary
      - name: Native Windows authority fixtures
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify release contract remains intact
        run: npm run release:check
      - name: Generate regression notice prerequisite
        run: node scripts/generate-third-party-notices.mjs --target x86_64-pc-windows-msvc --output THIRD_PARTY_NOTICES.txt
      - name: Run complete registered regression matrix
        run: npm run test:rc-regression-matrix
      - name: Require zero unused source carry
        run: npm run audit:unused-carry
      - name: Commit validated Track 07 and remove temporary harness
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/main.rs package.json scripts/test-pre1-native-authority-boundary.mjs
          git rm .github/workflows/pre1-track07-authority.yml scripts/prepare-pre1-track07.py
          git commit -m 'Harden Pre-1.0 Track 07 native authority boundary'
          git push origin HEAD:audit/pre-1.0-full-review
