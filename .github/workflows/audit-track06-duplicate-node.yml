name: Validate Track 06 Duplicate Node Handling

on:
  push:
    branches:
      - audit/pre-1.0-full-review

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/pre-1.0-full-review
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.1
      - run: npm ci --ignore-scripts
      - name: Run Track 06 core gate
        run: npm run test:pre1-core-model-refactor
      - name: Synchronize committed embedded frontend
        run: npm run bundle:embedded
      - name: Verify embedded/release contract parity
        run: npm run release:check
      - name: Generate regression-matrix notice prerequisite
        run: node scripts/generate-third-party-notices.mjs --target x86_64-pc-windows-msvc --output THIRD_PARTY_NOTICES.txt
      - name: Run complete registered regression matrix
        run: npm run test:rc-regression-matrix
      - name: Commit embedded sync and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/audit-track06-duplicate-node.yml
          git add tauri-ui/app.js
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Expected workflow removal or embedded synchronization was not staged.' }
          git commit -m "Finalize duplicate core node identity hardening"
          git push origin HEAD:audit/pre-1.0-full-review
