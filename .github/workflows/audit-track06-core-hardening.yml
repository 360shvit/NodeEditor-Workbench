name: Validate Track 06 Core Hardening

on:
  push:
    branches:
      - audit/pre-1.0-full-review

permissions:
  contents: write

jobs:
  harden:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/pre-1.0-full-review
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.1
      - run: npm ci --ignore-scripts
      - name: Apply Track 06 core identity and refactor hardening
        shell: pwsh
        run: |
          @'
          import fs from 'node:fs';
          const read = (file) => fs.readFileSync(file, 'utf8');
          const write = (file, text) => fs.writeFileSync(file, text, 'utf8');
          function replaceExact(file, before, after) {
            const source = read(file);
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(file + ': expected one replacement target, found ' + count);
            write(file, source.replace(before, after));
          }

          replaceExact(
            'src/core/validation.ts',
            "function diagnosticKey(item: Diagnostic): string {\n  const symbol = item.symbol ? `${item.symbol.symbolType}:${item.symbol.name}` : '';\n  return `${item.code}|${item.fileId ?? ''}|${item.nodeId ?? ''}|${symbol}|${item.message}`;\n}",
            "function diagnosticKey(item: Diagnostic): string {\n  return JSON.stringify([\n    item.code,\n    item.severity,\n    item.fileId ?? null,\n    item.nodeId ?? null,\n    item.symbol ? [item.symbol.symbolType, item.symbol.name] : null,\n    item.message,\n  ]);\n}",
          );
          replaceExact('src/core/symbolIndex.ts', '  return `${symbolType}::${name}`;', '  return JSON.stringify([symbolType, name]);');
          replaceExact(
            'src/core/matches.ts',
            "  if (field.refactorBehavior === 'literal') return `literal|${field.key}|${valueKey(field.value)}`;\n  if (field.refactorBehavior === 'field') return `field|${nodeKind}|${field.key}|${valueKey(field.value)}`;",
            "  if (field.refactorBehavior === 'literal') return JSON.stringify(['literal', field.key, valueKey(field.value)]);\n  if (field.refactorBehavior === 'field') return JSON.stringify(['field', nodeKind, field.key, valueKey(field.value)]);",
          );
          replaceExact(
            'src/core/refactor.ts',
            "  options: RenameSymbolOptions = {},\n): ChangeSet {\n  const record = project.symbolIndex.get(symbolKey(symbolType, oldName));",
            "  options: RenameSymbolOptions = {},\n): ChangeSet {\n  if (!newName.trim()) throw new Error('Symbol rename target must be non-empty.');\n  const record = project.symbolIndex.get(symbolKey(symbolType, oldName));",
          );
          replaceExact('src/core/refactor.ts', '    id: `symbol:${symbolType}:${oldName}`,', "    id: JSON.stringify(['symbol', symbolType, oldName]),");
          replaceExact(
            'package.json',
            '    "test:pre1-state-persistence-lifecycle": "node scripts/test-pre1-state-persistence-lifecycle.mjs"',
            '    "test:pre1-state-persistence-lifecycle": "node scripts/test-pre1-state-persistence-lifecycle.mjs",\n    "test:pre1-core-model-refactor": "npm run typecheck:core && node scripts/test-pre1-core-model-refactor.mjs"',
          );
          '@ | Set-Content -Path .track06-rewrite.mjs -Encoding utf8
          node .track06-rewrite.mjs
          Remove-Item .track06-rewrite.mjs -Force
      - name: Run Track 06 adversarial core gate
        run: npm run test:pre1-core-model-refactor
      - name: Synchronize committed embedded frontend
        run: npm run bundle:embedded
      - name: Verify embedded/release contract parity
        run: npm run release:check
      - name: Generate regression-matrix notice prerequisite
        run: node scripts/generate-third-party-notices.mjs --target x86_64-pc-windows-msvc --output THIRD_PARTY_NOTICES.txt
      - name: Run complete registered regression matrix
        run: npm run test:rc-regression-matrix
      - name: Commit validated Track 06 hardening and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/audit-track06-core-hardening.yml
          git add src/core/validation.ts src/core/symbolIndex.ts src/core/matches.ts src/core/refactor.ts scripts/test-pre1-core-model-refactor.mjs package.json tauri-ui/app.js
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Expected Track 06 changes were not staged.' }
          git commit -m "Harden Track 06 core identities and refactors"
          git push origin HEAD:audit/pre-1.0-full-review
