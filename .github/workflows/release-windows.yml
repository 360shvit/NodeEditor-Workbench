name: Publish Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  # All versions share rolling manifests; different tags must not publish concurrently.
  group: publish-windows
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tag commit from main
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag commit must be reachable from main.' }
      - name: Require publish bootstrap
        shell: pwsh
        run: |
          if (-not (Test-Path 'package-lock.json')) { throw 'package-lock.json is required.' }
          if (-not (Test-Path 'src-tauri/Cargo.lock')) { throw 'src-tauri/Cargo.lock is required.' }
          if ((Get-Content 'src-tauri/updater.pubkey' -Raw).Trim().StartsWith('UNCONFIGURED')) { throw 'Updater public key is not configured.' }
          $contract = Get-Content 'release-spec/release-contract.json' -Raw | ConvertFrom-Json
          if (-not $contract.updater.publication.publishable) { throw 'release-contract publication.publishable must be true before a tag can publish.' }
          if ($contract.version.revision -ne 'r1') { throw 'A public release must use revision r1.' }
          if ($env:GITHUB_REF_NAME -ne "v$($contract.version.semver)") { throw "Tag must exactly match v$($contract.version.semver)." }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.1
      - run: npm ci --ignore-scripts
      - run: npm run release:check
      - run: npm run test:github-updater-integration
      - name: Strict application TypeScript check
        run: node node_modules/typescript/bin/tsc -p tsconfig.app.json
      - name: Verify transitive third-party license metadata
        run: npm run audit:third-party
      - name: Verify Windows distribution dependency classification
        run: node scripts/audit-third-party-distribution.mjs --target x86_64-pc-windows-msvc
      - name: Verify Windows runtime third-party notice generation
        run: node scripts/generate-third-party-notices.mjs --target x86_64-pc-windows-msvc --output THIRD_PARTY_NOTICES.txt
      - name: Run all registered self-contained regression suites
        run: npm run test:rc-regression-matrix
      - name: Run deep release-integrity mutation validation
        run: node scripts/test-release-integrity-deep-v0.11.34.mjs
      - name: Require zero unused source carry
        run: npm run audit:unused-carry
      - name: Native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  publish:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.1
      - run: npm ci --ignore-scripts
      - name: Recheck Windows distribution dependency classification
        run: node scripts/audit-third-party-distribution.mjs --target x86_64-pc-windows-msvc
      - name: Generate Windows runtime third-party notices
        run: node scripts/generate-third-party-notices.mjs --target x86_64-pc-windows-msvc --output THIRD_PARTY_NOTICES.txt
      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.11.0 --locked
      - name: Build signed NSIS updater artifact
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          HGW_GITHUB_REPOSITORY: ${{ github.repository }}
          HGW_DISTRIBUTION_KIND: installed
        run: |
          cargo tauri build --bundles nsis --config src-tauri/tauri.installer.conf.json -- --locked
      - name: Stage allowlisted public release surface
        shell: pwsh
        env:
          HGW_GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/release-surface.mjs --installer-dir src-tauri/target/release/bundle/nsis --repository $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release surface staging failed.' }
          node scripts/release-surface.mjs --check
          if ($LASTEXITCODE -ne 0) { throw 'Release surface validation failed.' }
          node scripts/verify-updater-signature.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Staged updater signature verification failed.' }
      - name: Verify immutable version and monotonic channel publication
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-publication.mjs
      - name: Publish version release from release/public only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $contract = Get-Content 'release-spec/release-contract.json' -Raw | ConvertFrom-Json
          $tag = "v$($contract.version.semver)"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; same-SemVer republish is forbidden." }
          $assets = Get-ChildItem 'release/public' -File | ForEach-Object { $_.FullName }
          $args = @('release', 'create', $tag) + $assets + @('--verify-tag', '--title', "Hytale Generator Workbench $tag", '--notes', "Signed Windows release generated from the checked allowlisted release surface.")
          if ($contract.version.semver.Split('+')[0].Contains('-')) { $args += '--prerelease' }
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw 'GitHub version release creation failed.' }
      - name: Publish rolling updater manifests with channel isolation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ADVANCE_PREVIEW: ${{ steps.publication.outputs.advance_preview }}
        run: |
          $contract = Get-Content 'release-spec/release-contract.json' -Raw | ConvertFrom-Json
          $isPrerelease = $contract.version.semver.Split('+')[0].Contains('-')

          if ($env:ADVANCE_PREVIEW -eq 'true') {
            gh release view updater-preview *> $null
            if ($LASTEXITCODE -ne 0) {
              gh release create updater-preview --prerelease --title 'Updater preview manifest' --notes 'Rolling signed Preview updater manifest.'
              if ($LASTEXITCODE -ne 0) { throw 'Preview manifest release creation failed.' }
            }
            gh release upload updater-preview release/public/latest-preview.json --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Preview manifest publication failed.' }
          }

          if (-not $isPrerelease) {
            gh release view updater-stable *> $null
            if ($LASTEXITCODE -ne 0) {
              gh release create updater-stable --prerelease --title 'Updater stable manifest' --notes 'Rolling signed Stable updater manifest.'
              if ($LASTEXITCODE -ne 0) { throw 'Stable manifest release creation failed.' }
            }
            gh release upload updater-stable release/public/latest.json --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Stable manifest publication failed.' }
          }
