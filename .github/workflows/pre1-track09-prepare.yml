name: Validate Pre-1.0 Track 09

on:
  push:
    branches:
      - audit/pre-1.0-full-review

permissions:
  contents: write

jobs:
  validate-track09:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri -> target"
          cache-bin: "false"
          save-if: "false"
      - run: npm ci --ignore-scripts
      - name: Apply Track 09 hardening in validation workspace
        run: node scripts/prepare-pre1-track09.mjs
      - name: Run Track 09 source contract
        run: npm run test:pre1-apply-transaction-recovery
      - name: Strict application TypeScript check
        run: node node_modules/typescript/bin/tsc -p tsconfig.app.json
      - name: Verify native tests with locked dependencies
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify release contract parity
        run: npm run release:check
      - name: Generate Windows runtime third-party notices
        run: node scripts/generate-third-party-notices.mjs --target x86_64-pc-windows-msvc --output THIRD_PARTY_NOTICES.txt
      - name: Run complete registered regression matrix
        run: npm run test:rc-regression-matrix
      - name: Require zero unused source carry
        run: npm run audit:unused-carry
      - name: Commit only fully validated Track 09 changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/main.rs package.json scripts/test-pre1-apply-transaction-recovery.mjs
          git rm scripts/prepare-pre1-track09.mjs .github/workflows/pre1-track09-prepare.yml
          git diff --cached --check
          git commit -m "Harden Pre-1.0 Track 09 apply recovery"
          git push origin HEAD:audit/pre-1.0-full-review
