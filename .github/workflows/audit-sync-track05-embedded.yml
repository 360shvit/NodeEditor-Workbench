name: Sync Track 05 Embedded Frontend

on:
  push:
    branches:
      - audit/pre-1.0-full-review

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/pre-1.0-full-review
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run bundle:embedded
      - name: Commit deterministic embedded bundle and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/audit-sync-track05-embedded.yml
          git add tauri-ui/app.js tauri-ui/styles.css
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Expected embedded bundle or workflow cleanup changes were not staged.' }
          git commit -m "Sync embedded frontend for Track 05 audit"
          git push origin HEAD:audit/pre-1.0-full-review
