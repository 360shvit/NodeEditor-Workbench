name: Validate Pre-1.0 Track 09 Apply Transaction

on:
  push:
    branches:
      - audit/pre-1.0-full-review

permissions:
  contents: write

jobs:
  validate-track09:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri -> target"
          cache-bin: "false"
          save-if: "false"
      - run: npm ci --ignore-scripts
      - name: Prepare Track 09 hardening in runner
        run: |
          node scripts/prepare-pre1-track09.mjs
          node scripts/fix-pre1-track09-fixtures.mjs
          node scripts/harden-pre1-track09-late-writer.mjs
      - name: Run Track 09 transaction gate
        run: npm run test:pre1-apply-transaction-recovery
      - name: Run locked native failure/race tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify release/embedded contracts
        run: npm run release:check
      - name: Generate Windows runtime notices for regression prerequisites
        run: node scripts/generate-third-party-notices.mjs --target x86_64-pc-windows-msvc --output THIRD_PARTY_NOTICES.txt
      - name: Run complete registered regression matrix
        run: npm run test:rc-regression-matrix
      - name: Require zero unused source carry
        run: npm run audit:unused-carry
      - name: Commit validated Track 09 hardening and remove temporary harness
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pre1-track09-apply-transaction.yml .github/workflows/pre1-track09-prepare.yml scripts/prepare-pre1-track09.mjs scripts/fix-pre1-track09-fixtures.mjs scripts/harden-pre1-track09-late-writer.mjs
          git add src-tauri/src/main.rs package.json scripts/test-pre1-apply-transaction-recovery.mjs scripts/test-native-window-persistence-v0.11.11.mjs
          git diff --cached --check
          git commit -m "Harden Pre-1.0 Track 09 apply transactions"
          git push origin HEAD:audit/pre-1.0-full-review
