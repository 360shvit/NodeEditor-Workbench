name: Prepare RC2 Branch

on:
  push:
    branches:
      - release/0.11.36-rc.2-updater-e2e

permissions:
  contents: write

jobs:
  sync-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.1

      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Synchronize release contract and embedded UI
        run: npm run release:sync

      - name: Refresh npm lockfile root version
        run: npm install --package-lock-only --ignore-scripts

      - name: Refresh Cargo lockfile root package version
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null

      - name: Verify synchronized release contract
        run: npm run release:check

      - name: Strict application TypeScript check
        run: node node_modules/typescript/bin/tsc -p tsconfig.app.json

      - name: Verify Rust lockfile consistency
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null

      - name: Commit synchronized candidate files
        shell: bash
        run: |
          git rm .github/workflows/prepare-rc2-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Sync v0.11.36-rc.2 release candidate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
