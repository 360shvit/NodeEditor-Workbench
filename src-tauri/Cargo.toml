[package]
name = "hytale-generator-workbench"
version = "0.11.35"
description = "Hytale Generator Workbench desktop host"
authors = ["Hytale Generator Workbench contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-updater = "=2.11.0"
notify = "6.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
